<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<!-- Versionsnummer der Seite: bei jeder Änderung um eins erhöhen. Der Stick nimmt eine Seite aus dem Internet nur, wenn ihre Nummer nicht kleiner ist als die der eingebauten Seite. -->
<meta name="kw-version" content="6">
<title>Radio K.W. Wetter</title>
<link rel="icon" href="logo.png">
<style>
  @font-face { font-family: Inter; font-weight: 100 900; font-display: swap; src: url(fonts/Inter.woff2) format("woff2"); }

  :root {
    --w: #ffffff;
    --w2: rgba(255, 255, 255, .76);   /* Nebentext auf Glas */
    --linie: rgba(255, 255, 255, .16);
    --gelb: #ffd426;
    --regen: #7fd4ff;
    --aus: cubic-bezier(.23, 1, .32, 1);
  }
  /* 1rem = 1 % der Bildschirmhöhe: alles wächst mit 1080p/1440p mit */
  html { font-size: .92vh; }  /* 8 % kleiner, damit mit dem sicheren Rand alles noch passt */
  /* Sicherer Rand gegen Fernseher, die ein paar Prozent vom Bild abschneiden (Overscan): 5 % der Höhe oben/unten, 7 % seitlich */
  :root { --rv: 5.4rem; --rh: 7.6rem; }
  * { box-sizing: border-box; margin: 0; }
  /* Daueranzeige: nichts markieren, nichts heranzoomen, kein Lupen-/Kopiermenü, kein grauer Tipp-Blitz, Bilder nicht ziehbar */
  html, body { touch-action: none; -ms-touch-action: none; overscroll-behavior: none; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; -webkit-user-drag: none; }
  button { touch-action: manipulation; }
  body {
    height: 100vh; overflow: hidden; padding: var(--rv) var(--rh);
    background: #050a1c; color: var(--w);
    font-family: Inter, "Segoe UI", Roboto, sans-serif; font-weight: 500;
    font-variant-numeric: tabular-nums; font-optical-sizing: auto;
    display: grid; gap: 2rem;
    grid-template-columns: minmax(0, 1fr) 78rem;
    grid-template-rows: minmax(0, 1fr) 28rem;
    cursor: none;
  }
  /* Quellenvermerk im unteren Rand, klein aber lesbar */
  #quelle { position: fixed; right: calc(var(--rh) + 2.4rem); bottom: calc(var(--rv) - 1.9rem); font-size: 1.3rem; font-weight: 500; line-height: 1.3; color: rgba(255, 255, 255, .82); white-space: nowrap;
    text-shadow: 0 0 .4rem rgba(0, 0, 16, .9), 0 0 1.2rem rgba(0, 0, 16, .7); }  /* bleibt auch vor hellem Taghimmel lesbar */
  @media (max-aspect-ratio: 3/2) { #quelle { font-size: 1.5rem; } } /* Tablet: sonst unter 11 px */
  ::selection { background: var(--w); color: #000; }
  #himmel { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }

  /* Glas: dunkles, durchscheinendes Material mit heller Oberkante */
  .glas {
    background: rgba(12, 17, 34, .66); border-radius: 3rem; overflow: hidden;
    border: 1px solid rgba(255, 255, 255, .13);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .2), 0 1.4rem 4rem rgba(0, 0, 10, .28);
  }
  body.sparsam .glas { background: rgba(12, 17, 34, .8); }  /* ohne Glas-Unschärfe scheinen sonst nachts die Sterne als Pünktchen durch die Karten */
  @supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    body:not(.sparsam) .glas { background: rgba(12, 18, 38, .46); -webkit-backdrop-filter: blur(1.8rem) saturate(1.3); backdrop-filter: blur(1.8rem) saturate(1.3); }
  }
  .titel { font-size: 2.1rem; font-weight: 600; letter-spacing: .01em; color: var(--w2); font-variant-numeric: normal; }

  /* Radar: eigene Karte, Daten vom Deutschen Wetterdienst */
  #radarbox { position: relative; }
  #karte { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  #rkopf { position: absolute; top: 1.8rem; left: 2.8rem; text-shadow: 0 .2rem 1.2rem rgba(0, 0, 0, .55); }
  #rkopf div { display: flex; align-items: baseline; gap: 1.4rem; margin-top: .3rem; }
  #rwann { font-size: 4.4rem; font-weight: 600; line-height: 1.1; letter-spacing: -.02em; }
  #ruhr { font-size: 2.6rem; color: var(--w2); }
  #rkopf.alt #rwann { color: var(--gelb); }
  /* Vorhersage im Film: anders gefärbt und mit Zeitleiste, damit sie niemand für das Live-Bild hält */
  #rwann.vorher { color: var(--regen); }
  #rfilm { position: absolute; left: 9.6rem; right: 38rem; bottom: 4.4rem; height: .6rem; border-radius: 1rem; background: rgba(255, 255, 255, .18); opacity: 0; transition: opacity .4s; }
  #rfilm i { display: block; height: 100%; width: 0; border-radius: 1rem; background: var(--regen); }
  #rfilm.an { opacity: 1; }
  #radarbox.ohneregen:not(.mitfeld) #rfilm { display: none; }
  /* Zoom: senkrechte Pille direkt über dem Ebenen-Knopf (Tropfen); weicht, solange das Ebenen-Menü offen ist */
  #rzoom { position: absolute; left: 2.2rem; bottom: 8.3rem; display: flex; flex-direction: column; border-radius: 9rem;
    background: rgba(8, 12, 28, .62); box-shadow: inset 0 0 0 .2rem rgba(255, 255, 255, .28); transition: opacity .2s; }
  #radarbox.menue #rzoom { opacity: 0; pointer-events: none; }
  #rzoom button { -webkit-appearance: none; appearance: none; width: 5.4rem; height: 5.4rem; padding: 0; border: 0; border-radius: 9rem; background: none; color: #fff;
    cursor: pointer; display: flex; align-items: center; justify-content: center; transition: opacity .2s, background .2s; }
  #rzoom button + button { border-top: 1px solid rgba(255, 255, 255, .18); border-radius: 0 0 9rem 9rem; }
  #rzoom button:first-child { border-radius: 9rem 9rem 0 0; }
  #rzoom button:active { background: rgba(255, 255, 255, .16); }
  #rzoom button[aria-disabled="true"] { opacity: .3; cursor: default; }
  #rzoom button:focus-visible { outline: .25rem solid #fff; outline-offset: .2rem; }
  #rzoom svg { width: 2.6rem; height: 2.6rem; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; }
  /* roter, pulsierender Punkt vor „Live“ (nur bei frischem Radarbild) */
  #rwann.live::before { content: ""; display: inline-block; width: 1rem; height: 1rem; margin: 0 .8rem 0 -1.8rem; border-radius: 50%;
    background: #ff3b30; vertical-align: middle; position: relative; top: -.2rem; animation: puls 1.8s steps(8) infinite; }
  @keyframes puls { 0% { box-shadow: 0 0 0 0 rgba(255, 59, 48, .7); } 70%, 100% { box-shadow: 0 0 0 .7rem rgba(255, 59, 48, 0); } }
  @media (prefers-reduced-motion: reduce) { #rwann.live::before { animation: none; } }
  /* Ebenen-Auswahl unten links: runder Knopf mit dem Symbol der aktuellen Ebene, klappt nach oben eine Reihe Symbole auf */
  #rebene { position: absolute; left: 2.2rem; bottom: 2rem; display: flex; flex-direction: column-reverse; align-items: center; gap: .7rem; }
  #rebene button { -webkit-appearance: none; appearance: none; width: 5.4rem; height: 5.4rem; padding: 0; border: 0; border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center; background: rgba(8, 12, 28, .62); color: #fff; transition: background .2s, color .2s; }
  #rebene svg { width: 2.8rem; height: 2.8rem; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #rebene .haupt { box-shadow: inset 0 0 0 .2rem rgba(255, 255, 255, .28); }
  #rebene .liste { display: none; flex-direction: column-reverse; gap: .7rem; }
  #rebene.offen .liste { display: flex; }
  #rebene .liste button[aria-pressed="true"] { background: rgba(255, 255, 255, .9); color: #0b1020; }
  #rebene button:focus-visible { outline: .25rem solid #fff; outline-offset: .2rem; }
  /* offenes Menü: jede Ebene mit Namen daneben (nicht nur Symbole) */
  #rebene .liste button { position: relative; overflow: visible; }
  #rebene .liste button::after { content: attr(aria-label); position: absolute; left: 6.4rem; top: 50%; transform: translateY(-50%); white-space: nowrap;
    font-size: 2.2rem; font-weight: 600; line-height: 1; color: #fff; background: rgba(8, 12, 28, .82); padding: .9rem 1.4rem; border-radius: 1.2rem; pointer-events: none; }
  #rebene .liste button[aria-pressed="true"]::after { background: rgba(255, 255, 255, .9); color: #0b1020; }
  /* Ohne Regen (Warnungen, Wind, Temperatur) gibt es weder Bewegung noch Zugrichtung */
  #radarbox.ohneregen:not(.mitfeld) #rmodus, #radarbox.ohneregen #rzug { display: none; }
  #rlegende b { display: inline-block; width: 1.6rem; height: 1.6rem; border-radius: .4rem; margin-left: .6rem; vertical-align: -.2rem; }
  #rlegende { position: absolute; top: 2.2rem; right: 2.8rem; display: flex; align-items: center; gap: 1rem; font-size: 1.9rem; font-weight: 600; color: var(--w2); text-shadow: 0 .2rem 1rem rgba(0, 0, 0, .55); }
  /* Zugrichtung: nur Pfeil und Tempo, rechts in der Zeile von „Live“, bündig unter der Legende */
  #rzug { position: absolute; top: 6rem; right: 2.8rem; display: flex; align-items: center; gap: .8rem; font-size: 2.4rem; font-weight: 600; line-height: 1;
    color: #fff; white-space: nowrap; text-shadow: 0 .2rem 1rem rgba(0, 0, 0, .55); }
  #rzug:empty { display: none; }
  #rzug svg { width: 3.2rem; height: 3.2rem; flex: none; fill: #fff; filter: drop-shadow(0 .2rem .6rem rgba(0, 0, 0, .5)); }
  /* Umschalter Live / Bewegung (unten rechts im Radar) */
  /* kleiner und leichter als die runden Knöpfe daneben: nur eine zarte Fläche mit dünnem Ring, mittig zur Linie des Tropfen-Knopfs */
  #rmodus { position: absolute; right: 2.2rem; bottom: 2.3rem; display: flex; align-items: center; box-sizing: border-box; padding: .6rem; /* Luft zwischen Rand und Knöpfen, Mitte bleibt auf der Linie des Tropfen-Knopfs */ border-radius: 9rem; background: rgba(8, 12, 28, .42); box-shadow: inset 0 0 0 .15rem rgba(255, 255, 255, .2); }
  #rmodus button { -webkit-appearance: none; appearance: none; font: inherit; font-size: 1.55rem; font-weight: 600; line-height: 1; color: var(--w2); background: none; border: 0; cursor: pointer;
    padding: .65rem 1.2rem; border-radius: 9rem; transition: background .25s, color .25s; }
  #rmodus button[aria-pressed="true"] { background: rgba(255, 255, 255, .9); color: #0b1020; }
  #rmodus button:focus-visible { outline: .25rem solid #fff; outline-offset: .2rem; }
  @media (max-aspect-ratio: 3/2) { #rmodus button { padding: 1.6rem 1.8rem; } #rebene button, #rzoom button { width: 6rem; height: 6rem; } #rzoom { bottom: 8.9rem; } } /* Tablet: Finger brauchen ca. 44 px */
  #rlegende i { width: 13rem; height: .9rem; border-radius: 1rem; background: linear-gradient(90deg, #6eb4ff, #3287ff, #28c8eb, #3cdc96, #aae646, #ffe132, #ff7d23, #ff462d, #e128c8); }

  /* Rechte Spalte: jetzt in Wesel, darunter der Kreis */
  #rechts { display: flex; flex-direction: column; gap: 2rem; min-height: 0; }
  #held { position: relative; height: 19.6rem; flex: none; padding: .2rem 2.8rem 0; text-shadow: 0 .2rem 1.8rem rgba(0, 0, 0, .3);
    isolation: isolate; }
  /* weiche Abdunklung hinter der Schrift, läuft genau am Rand aus (keine sichtbare Kante) */
  #held::before { content: ""; position: absolute; top: -2rem; right: -2rem; bottom: -2rem; left: -2rem; z-index: -1;
    background: radial-gradient(closest-side, rgba(5, 10, 28, .62), rgba(5, 10, 28, .3) 60%, rgba(5, 10, 28, 0)); }  /* stark genug für 4,5:1 vor hellem Taghimmel */
  #held img { position: absolute; top: .4rem; right: 0; height: 8rem; width: auto; filter: drop-shadow(0 .6rem 1.6rem rgba(0, 0, 20, .35)); }
  #heldort { font-size: 3.6rem; font-weight: 600; line-height: 1.15; }
  #heldort small { font-size: 2.6rem; font-weight: 500; color: rgba(255, 255, 255, .9); margin-left: 1rem; }
  #heldtemp { font-size: 15rem; font-weight: 400; line-height: 15rem; letter-spacing: -.04em; margin-left: -.7rem; white-space: nowrap; }
  #heldtext { position: absolute; right: 2.8rem; bottom: 1.6rem; display: flex; align-items: center; gap: 1.4rem; text-align: right; }
  #heldtext > div { max-width: 31rem; }  /* sehr lange Wettertexte brechen in zwei Zeilen um */
  #heldtext svg.w { width: 8rem; height: 8rem; flex: none; }
  #heldtext b { display: block; font-size: 3.2rem; font-weight: 600; line-height: 1.15; }
  #heldtext span { display: block; font-size: 2.4rem; font-weight: 500; color: rgba(255, 255, 255, .9); }
  #heldtext span.kommt { font-weight: 600; color: var(--regen); }
  /* Veraltet: nicht gelb flächig (Gelb = Warnband des DWD), sondern dunkles Schild mit gelbem Rand; die alten Zahlen treten zurück */
  #warn { display: none; position: absolute; right: 2.8rem; bottom: 2.4rem; font-size: 2.6rem; font-weight: 700; line-height: 1.25; color: var(--gelb);
    background: rgba(20, 16, 0, .78); box-shadow: inset 0 0 0 .3rem var(--gelb); border-radius: 1.2rem; padding: 1rem 1.8rem; text-shadow: none; }
  body.veraltet #warn { display: block; }
  body.veraltet #heldtemp, body.veraltet .ort span, body.veraltet .temp, body.veraltet .regen, body.veraltet .dreier svg.w { opacity: .4; }

  /* DWD-Warnband (zwischen Kopf und Kreis, nimmt nur Platz, wenn es eine Warnung gibt) */
  #warnband { flex: none; margin-top: -.6rem; }
  #warnband:empty { display: none; }
  /* Ruhig statt Signalfläche: dunkle Glasfläche wie die Karten, nur Punkt, Ereignis und dünner Rand in der Warnfarbe */
  #warnband > div { --wc: var(--gelb); display: flex; align-items: baseline; border-radius: 1.6rem; padding: 1rem 2.4rem; font-size: 2.7rem; font-weight: 700; line-height: 1.15;
    color: var(--wc); background: rgba(12, 18, 38, .72); box-shadow: inset 0 0 0 .15rem color-mix(in srgb, var(--wc) 45%, transparent); text-shadow: none;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }  /* immer eine Zeile: das Ereignis steht vorn, der Rest darf abgeschnitten werden */
  #warnband > div::before { content: ""; flex: none; width: 1.1rem; height: 1.1rem; border-radius: 50%; background: var(--wc); margin-right: 1.4rem; align-self: center; }
  #warnband small { font-size: .815em; font-weight: 500; margin-left: 1.2rem; color: rgba(255, 255, 255, .86); overflow: hidden; text-overflow: ellipsis; }
  #warnband > div.zwei { display: block; white-space: normal; }
  #warnband > div.zwei::before { display: inline-block; vertical-align: middle; position: relative; top: -.12em; }
  #warnband .sv-moderate { --wc: #ff9f0a; }
  #warnband .sv-severe { --wc: #ff453a; box-shadow: inset 0 0 0 .2rem #ff453a; }
  #warnband .sv-extreme { --wc: #ff375f; box-shadow: inset 0 0 0 .25rem #ff375f; }
  body.veraltet #heldtext { display: none; }

  #kreis { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 1.8rem 2.8rem 1.6rem; }
  #orte { flex: 1; min-height: 0; margin-top: 1rem; display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: minmax(0, 1fr); column-gap: 2.4rem; }
  #orte > div { border-top: 1px solid var(--linie); display: flex; flex-direction: column; justify-content: center; min-width: 0; padding: .2rem 0; }
  .ort b { font-size: 2.4rem; font-weight: 600; line-height: 1.15; color: rgba(255, 255, 255, .9); white-space: nowrap; font-variant-numeric: normal; }
  .ort span { font-size: 3.6rem; font-weight: 600; line-height: 1.08; letter-spacing: -.02em; }
  body.warnung .ort b { font-size: 2.2rem; }  /* bei Warnband ist weniger Höhe da */
  body.warnung .ort span { font-size: 3rem; }
  .ort.warm span { color: #ffb86b; }
  .ort.kalt span { color: #8ecbff; }
  #stand { grid-column: span 2; flex-direction: row !important; align-items: center; justify-content: flex-start !important; gap: 1.2rem; font-size: 2.2rem; color: var(--w2); }
  #stand i { flex: none; width: 1.2rem; height: 1.2rem; border-radius: 50%; background: #39d67a; }
  #stand.alt { color: var(--gelb); }
  #stand.alt i { background: var(--gelb); }

  /* Untere Leiste */
  #leiste { grid-column: 1 / -1; display: grid; gap: 2rem; grid-template-columns: 1fr 1fr; }
  #leiste > section { padding: 1.8rem 2.4rem 1.6rem; display: flex; flex-direction: column; }
  .dreier { flex: 1; min-height: 0; margin-top: .6rem; display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
  .dreier > div { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .2rem; border-radius: 2rem; }
  /* Tagesabschnitt ist schon vorbei: Schrift zurücknehmen, damit der laufende heraussticht. Bewusst nur Farbe, kein opacity: jede
     halbtransparente Fläche über dem bewegten Himmel kostet auf dem Fire TV Stick Bild für Bild (Ruckler 1 % -> 19 %) */
  .dreier .vorbei h2, .dreier .vorbei .temp { color: rgba(255, 255, 255, .5); }
  .dreier .vorbei h2 small { color: rgba(255, 255, 255, .4); }
  .dreier .vorbei .regen { color: color-mix(in srgb, var(--regen) 50%, transparent); }
  .dreier .vorbei .regen svg { fill: color-mix(in srgb, var(--regen) 50%, transparent); }
  .dreier .jetzt { background: rgba(255, 255, 255, .13); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .18); }
  .dreier .leer { grid-column: 1 / -1; text-align: center; padding: 0 2rem; font-size: 2.8rem; font-weight: 600; color: var(--w2); }
  .dreier h2 { font-size: 3rem; font-weight: 600; line-height: 1.2; }
  .dreier h2 small { font-size: 2.5rem; font-weight: 500; color: var(--w2); margin-left: .8rem; }
  .dreier .jetzt small { color: rgba(255, 255, 255, .92); }
  .dreier svg.w { width: 6.2rem; height: 6.2rem; }
  .temp { font-size: 5.6rem; font-weight: 500; line-height: 1.05; letter-spacing: -.03em; }
  .temp small { font-size: 3.6rem; font-weight: 500; color: var(--w2); margin-left: 1.2rem; letter-spacing: -.02em; }
  .regen { font-size: 3rem; font-weight: 600; line-height: 1.15; color: var(--regen); display: flex; align-items: center; gap: .5rem; }
  .regen svg { width: 2.4rem; height: 2.4rem; fill: var(--regen); }

  /* Wetter-Icons */
  svg.w { overflow: visible; }
  body:not(.sparsam) svg.w { filter: drop-shadow(0 .4rem .8rem rgba(0, 0, 20, .28)); }
  svg.w .kern { fill: url(#vSonne); }
  svg.w .strahlen { stroke: #ffd426; stroke-width: 3.6; stroke-linecap: round; transform-box: fill-box; transform-origin: center; animation: dreh 50s steps(500) infinite; /* in Stufen: gleitend würde die Seite dauernd neu zeichnen */ }
  svg.w .mond { fill: url(#vMond); }
  svg.w .wo { fill: url(#vWolke); }
  svg.w .tr { fill: none; stroke: var(--regen); stroke-width: 3.8; stroke-linecap: round; }
  svg.w .tr path { animation: fall 1.3s linear infinite; }
  svg.w .tr path:nth-child(2) { animation-delay: -.45s; }
  svg.w .tr path:nth-child(3) { animation-delay: -.9s; }
  svg.w .fl { fill: #fff; }
  svg.w .fl circle { animation: fall 2.6s linear infinite; }
  svg.w .fl circle:nth-child(2) { animation-delay: -.9s; }
  svg.w .fl circle:nth-child(3) { animation-delay: -1.8s; }
  svg.w .ne { fill: none; stroke: #fff; stroke-width: 3.6; stroke-linecap: round; opacity: .85; }
  svg.w .bl { fill: #ffd426; animation: blitz 4s steps(1) infinite; }
  @keyframes dreh { to { transform: rotate(360deg); } }
  @keyframes fall { 0% { transform: translate(1px, -3px); opacity: .25; } 25% { opacity: 1; } 75% { opacity: 1; } 100% { transform: translate(-1.5px, 4px); opacity: .25; } }
  @keyframes blitz { 0%, 8%, 100% { opacity: 1; } 4%, 12% { opacity: .35; } }

  /* Ein Wert blendet kurz, wenn er sich wirklich ändert. Nie ganz unsichtbar (Animation könnte hängen). */
  @keyframes neu { from { opacity: .35; filter: blur(.4rem); } }
  .neu > * { animation: neu .6s var(--aus); }
  @media (prefers-reduced-motion: reduce) { .neu > *, svg.w * { animation: none !important; } }
</style>
</head>
<body>

<canvas id="himmel" width="640" height="360" aria-hidden="true"></canvas>

<!-- Farbverläufe für die Icons -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <radialGradient id="vSonne" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#fff3a0"/><stop offset="1" stop-color="#ffb800"/></radialGradient>
  <linearGradient id="vMond" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffbe6"/><stop offset="1" stop-color="#e7d79a"/></linearGradient>
  <linearGradient id="vWolke" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cfd9ea"/></linearGradient>
</defs></svg>

<main class="glas" id="radarbox">
  <canvas id="karte"></canvas>
  <div id="rkopf">
    <h1 class="titel">Regenradar</h1>
    <div><b id="rwann">lädt …</b><span id="ruhr"></span></div>
  </div>
  <div id="rlegende">leicht<i></i>stark</div>
  <div id="rzug"></div>
  <div id="rfilm" aria-hidden="true"><i></i></div>
  <div id="rzoom" role="group" aria-label="Radar zoomen"><button type="button" data-zoom="-1" aria-label="Heranzoomen"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button><button type="button" data-zoom="1" aria-label="Herauszoomen"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button></div>
  <div id="rebene"><button type="button" class="haupt" aria-haspopup="true" aria-expanded="false"></button><div class="liste" role="group" aria-label="Kartenebene"></div></div>
